<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>JustBot X Connector</title>
    <style>
      body {
        width: 320px;
        margin: 0;
        padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #101113;
        color: #f1f3f5;
      }
      h2 {
        margin: 0 0 6px;
        font-size: 16px;
      }
      p {
        margin: 0 0 12px;
        font-size: 12px;
        color: #909296;
        line-height: 1.4;
      }
      label {
        display: block;
        font-size: 11px;
        color: #adb5bd;
        margin-bottom: 4px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
        border-radius: 6px;
        border: 1px solid #373a40;
        background: #1a1b1e;
        color: #fff;
        font-size: 12px;
        margin-bottom: 10px;
      }
      button {
        width: 100%;
        padding: 9px 12px;
        border: none;
        border-radius: 6px;
        background: #4c6ef5;
        color: #fff;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        margin-bottom: 8px;
      }
      button.secondary {
        background: #25262b;
        color: #dee2e6;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      #qrBox {
        display: none;
        margin-top: 10px;
        padding: 10px;
        border-radius: 8px;
        background: #1a1b1e;
        border: 1px solid #373a40;
        text-align: center;
      }
      #qrSvgContainer {
        width: 170px;
        height: 170px;
        margin: 0 auto 8px;
        background: #fff;
        padding: 6px;
        border-radius: 8px;
      }
      #qrCodeText {
        font-size: 14px;
        font-weight: 700;
        color: #fff;
      }
      #status {
        font-size: 12px;
        padding: 8px;
        border-radius: 6px;
        display: none;
        word-break: break-word;
        margin-top: 6px;
      }
      #status.ok {
        display: block;
        background: rgba(18, 184, 134, 0.15);
        color: #38d9a9;
      }
      #status.err {
        display: block;
        background: rgba(250, 82, 82, 0.15);
        color: #ff8787;
      }
    </style>
  </head>
  <body>
    <h2>JustBot X Connector</h2>
    <p>1-Click Sign In to JustBot using your active X session, or scan a QR code to log in your phone.</p>
    <label for="justbotUrl">JustBot Dashboard URL</label>
    <input id="justbotUrl" type="url" value="http://localhost:3007" />
    <button id="syncBtn" type="button">1-Click Sign In &amp; Open JustBot</button>
    <button id="qrBtn" type="button" class="secondary">Mobile Login QR Code</button>
    <button id="copyBtn" type="button" class="secondary">Copy Cookie String</button>
    <div id="qrBox">
      <div id="qrSvgContainer"></div>
      <div id="qrCodeText"></div>
      <p style="margin: 4px 0 0; font-size: 11px;">Scan with your phone camera or enter this 6-digit code on the mobile login screen.</p>
    </div>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
