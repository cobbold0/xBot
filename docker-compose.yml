# Secrets come from the environment (Coolify "Environment Variables" or a local .env file). None are baked into images.
x-app-env: &app-env
  DATABASE_URL: postgres://xbot:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/xbot
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
  ANTHROPIC_PRICE_INPUT_PER_MTOK: ${ANTHROPIC_PRICE_INPUT_PER_MTOK:-3}
  ANTHROPIC_PRICE_OUTPUT_PER_MTOK: ${ANTHROPIC_PRICE_OUTPUT_PER_MTOK:-15}
  X_API_KEY: ${X_API_KEY:-}
  DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?set DASHBOARD_PASSWORD}
  SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
  TZ: ${TZ:-UTC}
  DRY_RUN: ${DRY_RUN:-true}
  AUTO_PUBLISH: ${AUTO_PUBLISH:-false}
  AUTO_LIKE: ${AUTO_LIKE:-false}
  AUTO_REPOST: ${AUTO_REPOST:-false}
  DAILY_BUDGET_USD: ${DAILY_BUDGET_USD:-2}
  MONTHLY_BUDGET_USD: ${MONTHLY_BUDGET_USD:-30}
  MAX_POSTS_PER_DAY: ${MAX_POSTS_PER_DAY:-3}
  MAX_LIKES_PER_DAY: ${MAX_LIKES_PER_DAY:-20}
  MAX_REPOSTS_PER_DAY: ${MAX_REPOSTS_PER_DAY:-5}
  MAX_REPLIES_PER_DAY: ${MAX_REPLIES_PER_DAY:-5}
  MAX_POSTS_PROCESSED_PER_RUN: ${MAX_POSTS_PROCESSED_PER_RUN:-15}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: xbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: xbot
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xbot -d xbot"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build: { context: ., dockerfile: Dockerfile.worker }
    command: ["npx", "tsx", "src/core/db/migrate-cli.ts"]
    restart: "no"
    environment: *app-env
    depends_on: { db: { condition: service_healthy } }

  worker:
    build: { context: ., dockerfile: Dockerfile.worker }
    restart: unless-stopped
    stop_grace_period: 30s
    environment: *app-env
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  web:
    build: { context: ., dockerfile: Dockerfile.web }
    restart: unless-stopped
    environment: *app-env
    expose: ["3007"]
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
